services:
  nextjs-prod-standalone:
    build:
      context: . 
      dockerfile: Dockerfile
      args:
      # In produciton api URL will be different
        NEXT_PUBLIC_APIURL: https://localhost:4001/api/
    image: portfolio-website:prod
    container_name: portfolio-website-prod
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_APIURL: https://localhost:4001/api/

  nextjs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: portfolio-website:dev
    container_name: portfolio-website
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APIURL: ${NEXT_PUBLIC_APIURL}
    volumes:
      - ./certificates:/app/certificates:ro
    develop:
      watch:
        - path: . 
          action: sync
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json
    
