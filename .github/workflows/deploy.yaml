name: Deploy coffee-shop to Azure

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
        run:
            working-directory: frontend/coffee-shop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/coffee-shop:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/coffee-shop:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/coffee-shop:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/coffee-shop:latest

      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/coffee-shop:latest


 